@PART[*]:HAS[@MODULE[ModuleGenerator],!MODULE[ModuleRadioisotopeGenerator],!MODULE[LaunchClamp],!MODULE[ModuleRestockLaunchClamp]]:AFTER[NearFutureElectrical]
{
    MODULE
    {
        name = ModuleRadioisotopeGenerator
        BasePower = #$/MODULE[ModuleGenerator]/OUTPUT_RESOURCE[ElectricCharge]/rate$
        HalfLife = 87.70
        EasyMode = false
    }

    MODULE:NEEDS[B9PartSwitch]
    {
        name = ModuleB9PartSwitch
        moduleID = isotopeSwitch
        switcherDescription = Isotope
        switcherDescriptionPlural = Isotopes
        affectDragCubes = false
        affectFARVoxels = false
        switchInFlight = false

        SUBTYPE
        {
            name = default
            title = Pu-238
            primaryColor = #999999
            secondaryColor = #999999
            descriptionSummary = Plutonium-238 standard RTG material
            descriptionDetail = Plutonium-238 has a half-life of 87.70 years and an initial power density of 0.567 W/g
            defaultSubtypePriority = 10
        }

        SUBTYPE
        {
            name = americium
            title = Am-241
            primaryColor = #999999
            secondaryColor = #309999
            descriptionSummary = Americium-241 low power RTG material
            descriptionDetail = Americium-241 has a much longer half-life of 432.60 years but a paltry initial power density of 0.114 W/g
            addedCost = #$/cost$
            @addedCost *= -0.90
            MODULE
            {
                IDENTIFIER
                {
                    name = ModuleRadioisotopeGenerator
                }
                DATA
                {
                    BasePower = #$/MODULE[ModuleGenerator]/OUTPUT_RESOURCE[ElectricCharge]/rate$
                    @BasePower /= 0.567
                    @BasePower *= 0.114
                    HalfLife = 432.60
                }
            }
        }

        SUBTYPE
        {
            name = strontium
            title = Sr-90
            primaryColor = #999999
            secondaryColor = #993030
            descriptionSummary = Strontium-90 high power RTG material
            descriptionDetail = Strontium-90 has a shorter half-life of 28.91 years but a higher initial power density of 0.950 W/g
            MODULE
            {
                IDENTIFIER
                {
                    name = ModuleRadioisotopeGenerator
                }
                DATA
                {
                    BasePower = #$/MODULE[ModuleGenerator]/OUTPUT_RESOURCE[ElectricCharge]/rate$
                    @BasePower /= 0.567
                    @BasePower *= 0.950
                    HalfLife = 28.91
                }
            }
        }        
    }

    !MODULE[ModuleGenerator] {}
}

@DYNAMICBATTERYSTORAGE:AFTER[NearFutureElectrical]
{
    %PARTMODULEHANDLER[ModuleRadioisotopeGeneratorPowerHandler]
    {
        %name = ModuleRadioisotopeGenerator
        %handlerModuleName = GenericFieldDataHandler
        %type = Power
        %visible = true
        %solarEfficiencyEffects = false
        %producer = true
        %consumer = false
        %simulated = true
        %continuous = true
        %HANDLER_CONFIG
        {
            %editorFieldName = BasePower
            %flightFieldName = ActualPower
            %editorValueScalar = 1.0
            %flightValueScalar = 1.0
        }
    }
}
